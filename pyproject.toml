[project]
name = "finagent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1",
  "langchain-core>=0.2.0",
  "langchain-openai>=0.1.20",
  "langchain-community>=0.2.10",
  "langgraph>=0.2.30",
  "gradio>=4.44.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
